name: Reference table

# Checks that the reference tables are what their scripts produce, so they cannot drift:
# tests/reference/ape_distances.tsv from generate.R (R + ape), and tests/reference/tn93_distances.tsv
# (with tests/reference/tn93/random.fasta) from tn93/generate.py (HIV-TRACE's tn93, built from
# source). Runs when any of them changes.
on:
  push:
    branches: [main]
    paths: [tests/reference/**, .github/workflows/reference.yml]
  pull_request:
    paths: [tests/reference/**, .github/workflows/reference.yml]
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install ape
        run: Rscript -e 'install.packages("ape")'
      - name: Regenerate
        run: Rscript tests/reference/generate.R
      # The first line records the ape and R versions, which may differ from the committed ones
      - name: Compare with the committed table
        run: |
          git show HEAD:tests/reference/ape_distances.tsv | tail -n +2 > committed.tsv
          tail -n +2 tests/reference/ape_distances.tsv > regenerated.tsv
          diff -u committed.tsv regenerated.tsv

  tn93:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds tn93 at the pinned commit (git, cmake and a C++ compiler are on the runner)
      - name: Regenerate
        run: python3 tests/reference/tn93/generate.py
      - name: Compare with the committed table and data
        run: git diff --exit-code -- tests/reference/tn93_distances.tsv tests/reference/tn93/
